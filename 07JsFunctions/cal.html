 <html>
    <head>Calculator</head>

    <body>

      <input id="val1"/><br>
      <input id="val2"/>
      <br>

<!-- Buttons -->
      <button id="addbtn">Add</button>
       <button id="mulbtn">Mul</button>
        <button id="subbtn">Sub</button>

        <!-- Result -->
        <p id="Result">      </p>
    </body>


    <script>
    document.getElementById("addbtn").onclick=add;
    document.getElementById("mulbtn").onclick=mul;
    document.getElementById("subbtn").onclick=sub;
    function add(){
          let a=document.getElementById("val1").value;
          let b=document.getElementById("val2").value;
            let res=parseInt(a)+parseInt(b);
            document.getElementById("Result").innerHTML=res
        }
    function mul(){
       let a = document.getElementById("val1").value;
       let b = document.getElementById("val2").value;
        let multiple = parseInt(a)*parseInt(b);
        document.getElementById("Result").innerHTML=multiple;
    }
     function sub(){
       let a = document.getElementById("val1").value;
       let b = document.getElementById("val2").value;
        let Substraction = parseInt(a)-parseInt(b);
        document.getElementById("Result").innerHTML=Substraction;
    }

    </script>
 </html>
